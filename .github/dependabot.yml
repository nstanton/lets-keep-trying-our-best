# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      npm-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      # ESLint 10 currently crashes in eslint-plugin-react when linting this app.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # eslint-config-next's TypeScript parser currently requires TypeScript <6.1.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Keep the type definitions aligned with the Node 22 runtime.
      - dependency-name: "@types/node"
        versions:
          - ">=23"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
